name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build, unit tests, H2 + vendor contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (surefire) + integration tests (failsafe).
      # Vendor contract tests start PostgreSQL, MySQL and SQL Server with Testcontainers
      # and run the schema migrations + order lifecycle with Hibernate ddl-auto=validate.
      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore

  docker-image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise/oms-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
