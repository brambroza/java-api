# Local developer profile: embedded H2, no auth, seeded sample data, H2 console.
spring:
  datasource:
    url: jdbc:h2:mem:oms;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    enabled: false
  seed-data: true
